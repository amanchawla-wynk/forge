[project]
name = "forge"
version = "0.0.1"
description = "PRD completeness & actionability grader, exposed over MCP."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "mcp>=2.2,<3",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "semchunk>=4.1,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
# Optional local dashboard only. Never required by forge-mcp or the domain
# core. See docs/DECISIONS.md D-033 before adding to this list.
dashboard = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "litellm>=1.50",
    "httpx>=0.27",
]

[project.scripts]
forge-mcp = "forge.mcp.server:main"
forge-dashboard-api = "forge_dashboard.app:main"
forge-setup-cursor = "forge.setup_cursor:main"
forge-setup-opencode = "forge.setup_opencode:main"
forge-calibration = "forge.calibration:main"
forge-review-eval = "forge.review_eval:main"
forge-proxy-diagnostics = "forge.proxy_diagnostics:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge", "src/forge_dashboard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
